name: 'enphase dashboard'

services:
    enphase-dashboard:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: enphase-dashboard
        ports:
            - "5000:5000"
        volumes:
            - ./configuration:/app/configuration
            - instance_data:/app/instance
        restart: unless-stopped
        depends_on:
            - db
        environment:
            - FLASK_ENV=production
            - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-enphase}
            - TRUST_PROXY_COUNT=${TRUST_PROXY_COUNT:-0}

    db:
        image: postgres:15-alpine
        container_name: enphase-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-enphase}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
    instance_data:
