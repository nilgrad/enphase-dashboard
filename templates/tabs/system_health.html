<div class="tab-header">
    <h2>Per-Inverter Health &amp; Status</h2>
    <button type="button" class="refresh-btn" @click="fetchHealth()" :disabled="loadingHealth">
        <span class="btn-content-stack">
            <span :class="{ 'invisible-text': loadingHealth }">Refresh Health</span>
            <span :class="{ 'invisible-text': !loadingHealth }" class="loading">Refreshing...</span>
        </span>
    </button>
</div>

<div class="health-toolbar" x-show="healthSummary.total > 0" x-cloak>
    <div class="health-summary-bar mb-0">
        <span class="status-tag" :class="healthSummary.operating === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Operating: ' + healthSummary.operating + '/' + healthSummary.total"></span>
        <span class="status-tag" :class="healthSummary.producing === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Producing: ' + healthSummary.producing + '/' + healthSummary.total"></span>
        <span class="status-tag" :class="healthSummary.communicating === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Communicating: ' + healthSummary.communicating + '/' + healthSummary.total"></span>
    </div>
    <div class="range-pill-group" role="group" aria-label="Filter inverters">
        <button type="button" class="range-pill" :class="{ active: healthFilter === 'all' }" @click="healthFilter = 'all'" x-text="'All (' + healthSummary.total + ')'">All</button>
        <button type="button" class="range-pill" :class="{ active: healthFilter === 'issues', 'has-issues': healthIssueCount > 0 }" @click="healthFilter = 'issues'" x-text="'Issues (' + healthIssueCount + ')'">Issues</button>
    </div>
</div>

<div class="data-box" x-show="loadingHealth && inverters.length === 0">
    <p class="loading">Updating inverter status...</p>
</div>

<div class="data-box mt-1" x-show="inverters.length > 0 && filteredInverters.length === 0" x-cloak>
    <p class="empty-ok-text">✓ All inverters are operating normally.</p>
</div>

<div class="inverters-grid" x-show="filteredInverters.length > 0">
    <template x-for="inv in filteredInverters" :key="inv.serial_num">
        <div class="inverter-card" :class="isInverterHealthy(inv) ? 'inverter-ok' : 'inverter-err'">
            <h4 class="inverter-title" x-text="'SN: ' + inv.serial_num"></h4>
            <p class="inverter-meta">
                <strong>Model:</strong> <span class="text-main fw-semibold" x-text="inv.part_num"></span>
            </p>
            <p class="inverter-meta">
                <strong>Reported:</strong>
                <span class="text-main" :title="formatDate(inv.last_rpt_date)" x-text="formatRelativeTime(inv.last_rpt_date)"></span>
            </p>
            <p class="inverter-status-err" x-show="inv.device_status && !inv.device_status.includes('envoy.global.ok')">
                <strong>Status:</strong> <span class="fw-semibold" x-text="formatInverterStatus(inv.device_status)"></span>
            </p>
            <div class="inverter-tags">
                <span class="status-tag tag-sm" :class="inv.operating ? 'status-ok' : 'status-err'" title="Inverter operating status">Operating</span>
                <span class="status-tag tag-sm" :class="inv.producing ? 'status-ok' : 'status-err'" title="Power production status">Producing</span>
                <span class="status-tag tag-sm" :class="inv.communicating ? 'status-ok' : 'status-err'" title="Gateway communication status">Comm</span>
            </div>
        </div>
    </template>
</div>
