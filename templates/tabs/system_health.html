<div class="tab-header">
    <h2>Per-Inverter Health &amp; Status</h2>
    <button class="refresh-btn" @click="fetchHealth()" :disabled="loadingHealth">
        <span class="btn-content-stack">
            <span :class="{ 'invisible-text': loadingHealth }">Refresh Health</span>
            <span :class="{ 'invisible-text': !loadingHealth }" class="loading">Refreshing...</span>
        </span>
    </button>
</div>

<div class="health-summary-bar" x-show="healthSummary.total > 0">
    <span class="status-tag" :class="healthSummary.operating === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Operating: ' + healthSummary.operating + '/' + healthSummary.total"></span>
    <span class="status-tag" :class="healthSummary.producing === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Producing: ' + healthSummary.producing + '/' + healthSummary.total"></span>
    <span class="status-tag" :class="healthSummary.communicating === healthSummary.total ? 'status-ok' : 'status-err'" x-text="'Communicating: ' + healthSummary.communicating + '/' + healthSummary.total"></span>
</div>

<div class="data-box" x-show="loadingHealth && inverters.length === 0">
    <p class="loading">Updating inverter status...</p>
</div>

<div class="inverters-grid" x-show="inverters.length > 0">
    <template x-for="inv in inverters" :key="inv.serial_num">
        <div class="inverter-card" :style="{ borderTopColor: (inv.operating && inv.producing && inv.communicating) ? 'var(--success)' : 'var(--danger)' }">
            <h4 class="inverter-title" x-text="'SN: ' + inv.serial_num"></h4>
            <p class="inverter-meta">
                <strong>Model:</strong> <span class="text-main fw-semibold" x-text="inv.part_num"></span>
            </p>
            <p class="inverter-meta">
                <strong>Reported:</strong> <span class="text-main" x-text="formatDate(inv.last_rpt_date)"></span>
            </p>
            <p class="inverter-status-err" x-show="inv.device_status && !inv.device_status.includes('envoy.global.ok')">
                <strong>Status:</strong> <span class="fw-semibold" x-text="formatInverterStatus(inv.device_status)"></span>
            </p>
            <div class="inverter-tags">
                <span class="status-tag tag-sm" :class="inv.operating ? 'status-ok' : 'status-err'">OP</span>
                <span class="status-tag tag-sm" :class="inv.producing ? 'status-ok' : 'status-err'">PROD</span>
                <span class="status-tag tag-sm" :class="inv.communicating ? 'status-ok' : 'status-err'">COMM</span>
            </div>
        </div>
    </template>
</div>
